<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182f32"><title>Mosswake Island</title><style>
*{box-sizing:border-box}body{margin:0;background:#87c9bf;color:#fcf4d7;font:16px system-ui,sans-serif;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}.hud{position:fixed;inset:12px 14px auto;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}.panel,#tip{background:#183636ed;border:1px solid #c0dcaa66;border-radius:12px;padding:8px 12px;box-shadow:0 3px 12px #122e3227}.hud b{display:block;font:700 18px Georgia,serif}.hud small{font-size:12px}.hud button,button{pointer-events:auto;cursor:pointer;border:1px solid #e8f3cb66;border-radius:12px;background:#203d3b;color:#fff4d6;font-weight:700;padding:10px 13px}.hud button{margin-left:4px}#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#112f3569}article{background:#193936f5;border:1px solid #c8dcb882;border-radius:22px;width:min(430px,100%);padding:clamp(18px,4vw,32px);max-height:90vh;overflow:auto}h1{font:700 clamp(34px,7vw,58px)/.98 Georgia,serif;letter-spacing:-.04em;margin:6px 0 14px}p{line-height:1.45}#choices{display:flex;gap:8px;flex-wrap:wrap}button.primary,#act{background:#f8ce73;color:#243c35}#bar{position:fixed;inset:auto 16px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}#pad{border-radius:50%;width:86px;height:86px;background:#21494591;border:2px solid #fbf3d7a3;display:grid;place-items:center;touch-action:none;pointer-events:auto}#pad i{background:#f9edcdcf;border-radius:50%;width:31px;height:31px}#act{touch-action:manipulation;min-height:52px;max-width:45vw}#tip{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);width:max-content;max-width:86%;text-align:center;font-size:14px;pointer-events:none}#bag{font-variant-numeric:tabular-nums}button:focus-visible{outline:3px solid white}[hidden]{display:none!important}@media(max-height:420px){#pad{width:66px;height:66px}#tip{bottom:68px}.hud{inset:5px 9px auto}.panel{padding:5px 8px}}
</style><canvas id="view" aria-label="Mosswake island play area"></canvas><div class="hud" id="hud" hidden><div class="panel"><b>Mosswake Island</b><small id="bag"></small></div><button id="journal">Field journal</button></div><div id="bar" hidden><div id="pad" aria-label="Movement joystick"><i></i></div><button id="act" class="primary">Explore</button></div><div id="tip" role="status" hidden></div><div id="overlay"><article><h1 id="title">Mosswake Island</h1><p id="body"></p><div id="choices"></div></article></div>
<script>
'use strict';
const el=id=>document.getElementById(id),cv=el('view'),g=cv.getContext('2d'),saveKey='mosswake-island-v1';
const species=[{name:'Fernkip',color:'#81c273',dark:'#396e54',ear:'#deef97',job:'wood'},{name:'Pebblit',color:'#a1adcc',dark:'#59647f',ear:'#d2dcef',job:'stone'},{name:'Glimmoth',color:'#ffb674',dark:'#ac6653',ear:'#ffe69b',job:'berries'}];
const camp={x:0,y:0},beacon={x:252,y:-138};
const resources=[[-55,5,'bush'],[-75,65,'tree'],[72,-7,'rock'],[-137,-125,'tree'],[119,43,'bush'],[130,-110,'rock'],[-205,115,'rock'],[180,135,'tree'],[-42,-185,'bush'],[235,-90,'bush'],[-235,-26,'tree'],[72,178,'tree'],[-112,180,'bush'],[175,-185,'rock']];
const wild=[{x:24,y:57,type:0},{x:-165,y:-82,type:1},{x:204,y:88,type:2}];
const fresh=()=>({x:0,y:30,wood:0,stone:0,berries:2,friends:[],active:-1,camp:false,lit:false,rest:{},work:0});
let s=fresh(),saved=false;try{const data=JSON.parse(localStorage.getItem(saveKey));if(data&&Array.isArray(data.friends)&&Number.isFinite(data.x)){s=Object.assign(fresh(),data);saved=true}}catch{}
let mode='menu',clock=0,last=0,stamp=0,notice=0,stick=[0,0],padId=null,keys=new Set(),target=null,fx=s.x,fy=s.y+16,facing=1,step=0,viewW=0,viewH=0,scale=1,camX=s.x,camY=s.y,duel=null;
function save(){try{localStorage.setItem(saveKey,JSON.stringify(s));saved=true}catch{}}
function say(msg){notice=3;el('tip').textContent=msg;el('tip').hidden=false}
function sheet(title,body,actions){mode='menu';stick=[0,0];keys.clear();el('pad').firstElementChild.style.transform='';el('overlay').hidden=false;el('hud').hidden=el('bar').hidden=el('tip').hidden=true;el('title').textContent=title;el('body').textContent=body;const c=el('choices');c.textContent='';actions.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;if(!i)b.className='primary';b.onclick=fn;c.appendChild(b)})}
function play(){mode='play';el('overlay').hidden=true;el('bar').hidden=el('hud').hidden=false;notice=0;refresh();save()}
function goal(){if(!s.friends.length)return 'Find Fernkip southeast of the camp. Offer 2 berries.';if(!s.camp)return 'Build a shelter at camp: 4 wood + 3 stone.';if(s.friends.length<3)return 'Find Fernkip near camp, Pebblit northwest and Glimmoth southeast.';if(!s.lit)return 'Challenge the beacon guardian in the northeast.';return 'Beacon restored. Explore with your companions.'}
function journal(){const buttons=s.friends.map(i=>['Travel with '+species[i].name,()=>{s.active=i;fx=s.x;fy=s.y;play();say(species[i].name+' is following you.')}]);sheet('Field journal',goal()+' Your team: '+(s.friends.map(i=>species[i].name+' ('+species[i].job+')').join(', ')||'No companions yet')+'.', [['Back to island',play],...buttons])}
function interact(){if(mode!=='play')return;const t=target;if(!t){say(goal());return}
 if(t.kind==='creature'){const i=t.id;if(s.berries<2){say('Gather 2 berries from a red berry bush.');return}s.berries-=2;s.friends.push(i);s.active=i;fx=s.x;fy=s.y;say(species[i].name+' joined your team!')}
 else if(t.kind==='camp'){if(s.camp){journal();return}if(s.wood<4||s.stone<3){say('Shelter needs 4 wood and 3 stone.');return}s.wood-=4;s.stone-=3;s.camp=true;say('Shelter built. Your companion can now gather supplies.')}
 else if(t.kind==='beacon'){if(s.lit){say('The beacon is shining.');return}if(!s.camp||s.friends.length<3){say('Build a shelter and befriend all 3 species first.');return}duel={hp:8,foe:11,turn:0};battle();return}
 else{const kind=resources[t.id][2],item={tree:'wood',rock:'stone',bush:'berries'}[kind];s[item]+=2;s.rest[t.id]=Date.now()+9000;say('+2 '+item)}
 save();refresh()}
function battle(msg=''){const d=duel;const charged=d.turn%3===2;
 function resolve(choice){let hit=choice==='guard'?0:choice==='burst'?4:2;if(choice==='burst'){if(!s.berries)return;s.berries--;save()}d.foe-=hit;if(d.foe<=0){s.lit=true;save();sheet('Beacon restored','Your companions awakened the island beacon. Your shelter and team are saved.',[['Return to island',play]]);return}const harm=choice==='guard'?0:charged?4:1;d.hp-=harm;d.turn++;if(d.hp<=0){sheet('Back to camp','Your team retreated safely. Gather berries for a stronger burst and guard when the guardian charges.',[['Rest at camp',()=>{s.x=0;s.y=30;play()}]]);return}battle(choice==='guard'?'Your team blocked the strike.':'Your team dealt '+hit+' damage.')}
 sheet('Beacon guardian',(msg?msg+' ':'')+'Team '+d.hp+'/8 · Guardian '+d.foe+'/11. '+(charged?'It is charging a heavy strike.':'It is preparing a light strike.'),[['Strike',()=>resolve('strike')],['Guard',()=>resolve('guard')],...(s.berries?[['Berry burst (1)',()=>resolve('burst')]]:[]),['Retreat',play]])}
function creaturePos(i){const a=wild[i];return {x:a.x+Math.cos(clock*.64+i)*6,y:a.y+Math.sin(clock*.73+i)*5}}
function available(){const a=[{...camp,kind:'camp',label:s.camp?'Visit shelter':'Build shelter'},{...beacon,kind:'beacon',label:s.lit?'Beacon':'Challenge guardian'}];wild.forEach((v,i)=>{if(!s.friends.includes(i))a.push({...creaturePos(i),kind:'creature',id:i,label:'Befriend '+species[i].name})});resources.forEach(([x,y,k],id)=>{if(!(s.rest[id]>Date.now()))a.push({x,y,kind:'resource',id,label:{tree:'Gather wood',rock:'Gather stone',bush:'Pick berries'}[k]})});return a}
function refresh(){let best=38;target=null;for(const v of available()){const d=Math.hypot(v.x-s.x,v.y-s.y);if(d<best){best=d;target=v}}el('act').textContent=target?target.label:'Explore';el('bag').textContent='Wood '+s.wood+' · Stone '+s.stone+' · Berries '+s.berries}
function tick(dt){clock+=dt;if(mode!=='play')return;let dx=stick[0]+Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=stick[1]+Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const len=Math.max(1,Math.hypot(dx,dy));s.x+=dx*dt*87/len;s.y+=dy*dt*105/len;let coast=Math.hypot(s.x/335,s.y/236);if(coast>1){s.x/=coast;s.y/=coast}if(dx||dy){step+=dt*12;if(dx)facing=Math.sign(dx)}if(s.active>=0){fx+=(s.x-18*facing-fx)*Math.min(1,dt*3.1);fy+=(s.y+7-fy)*Math.min(1,dt*3.1);if(s.camp){s.work+=dt;if(s.work>=20){s.work-=20;let type=species[s.active];s[type.job]++;say(type.name+' gathered '+type.job);save()}}}
 camX+=(s.x-camX)*Math.min(1,dt*7);camY+=(s.y-camY)*Math.min(1,dt*7);stamp+=dt;if(stamp>1){save();stamp=0}if(notice>0){notice-=dt;if(notice<=0)el('tip').hidden=true}refresh()}
function oval(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
function poly(p,c){g.fillStyle=c;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function line(x,y,X,Y,w,c){g.lineWidth=w;g.lineCap='round';g.strokeStyle=c;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function pet(i,x,y,f=1){const a=species[i],hop=Math.sin(clock*3+i)*1.5;g.save();g.translate(x,y);g.scale(f,1);oval(1,1,12,3,'#45664f60');g.translate(0,hop);if(i===2){for(const sign of [-1,1]){oval(sign*10,-17,7,10+Math.sin(clock*8)*2,a.ear);oval(sign*10,-18,3,5,'#ed9867')}}else{poly([[-8,-19],[-13,-34],[-2,-25]],a.dark);poly([[3,-21],[10,-35],[11,-16]],a.ear)}
 oval(-1,-10,11,10,a.dark);oval(2,-14,11,10,a.color);oval(7,-12,6,4,a.ear);oval(7,-17,2,2.4,'#213c39');oval(7.5,-18,0.7,.7,'white');oval(-5,-2,4,2.8,a.dark);oval(6,-2,4,2.8,a.dark);if(i===0)poly([[-9,-7],[-22,-17],[-17,-4]],a.color);g.restore()}
function prop(kind,x,y,used){oval(x+2,y+1,kind==='tree'?16:11,4,'#50745255');if(kind==='tree'){line(x,y,x-1,y-27,7,'#755740');if(used)return;for(const [ox,oy,r,col] of [[-9,-29,14,'#367867'],[8,-30,16,'#42856b'],[-2,-42,16,'#6ba06e'],[-6,-45,8,'#a0bb77']])oval(x+ox,y+oy,r,r*.85,col)}else if(kind==='rock'){poly([[x-14,y],[x-9,y-12],[x+3,y-(used?9:17)],[x+12,y-9],[x+15,y],[x+2,y+3]],'#7b9292');poly([[x-9,y-12],[x+3,y-(used?9:17)],[x+9,y-8],[x-3,y-5]],'#b2c2ac')}else{oval(x,y-6,14,9,'#4a8760');oval(x-4,y-10,9,6,'#79a568');if(!used)for(const [a,b] of [[-7,-8],[4,-13],[8,-6],[-1,-4]])oval(x+a,y+b,2.5,2.5,'#d67358')}}
function shelter(x,y){oval(x,y,24,7,'#506e4850');if(!s.camp){for(let i=0;i<8;i++){let a=i*Math.PI/4;oval(x+12*Math.cos(a),y+5*Math.sin(a),4,3,'#8e967d')}line(x-5,y,x+5,y-4,3,'#75543b');return}poly([[x-27,y],[x-4,y-35],[x+28,y]],'#bf8b59');poly([[x-28,y],[x-4,y-35],[x+2,y]],'#e8c787');poly([[x-14,y],[x-5,y-19],[x,y]],'#484d40');line(x-30,y+3,x-4,y-35,2,'#715944')}
function ranger(x,y){oval(x,y+1,9,3,'#42665166');const st=mode==='play'&&Math.hypot(...stick)+keys.size?Math.sin(step)*2:0;line(x-3,y-9,x-3+st,y,4,'#4a4d43');line(x+3,y-9,x+3-st,y,4,'#4a4d43');oval(x,y-13,7,9,'#bc724f');oval(x-facing*6,y-13,4,6,'#887243');oval(x,y-23,5,6,'#dca77c');oval(x,y-27,10,2.6,'#916b46');oval(x,y-29,6,4,'#d9b776')}
const landscape=document.createElement('canvas');landscape.width=820;landscape.height=540;
function paint(){const t=landscape.getContext('2d');t.translate(410,270);let seed=71;function rnd(){seed=seed*16807%2147483647;return seed/2147483647}function island(rx,ry,c){t.beginPath();for(let i=0;i<=180;i++){const a=i*Math.PI/90,n=1+.016*Math.sin(9*a)+.012*Math.cos(14*a);t.lineTo(Math.cos(a)*rx*n,Math.sin(a)*ry*n)}t.closePath();t.fillStyle=c;t.fill()}island(375,216,'#94d3bf');island(363,207,'#f3e1a8');island(347,193,'#a7c684');t.save();t.clip();for(let i=0;i<1600;i++){const x=rnd()*740-370,y=rnd()*415-207;t.fillStyle=i%3?'#91b877':'#c4d496';t.fillRect(x,y,rnd()*5+1,1.5)}t.strokeStyle='#cbd09b';t.lineWidth=10;t.beginPath();t.moveTo(-160,-67);t.quadraticCurveTo(-30,17,0,0);t.quadraticCurveTo(112,-12,285,-112);t.stroke();t.restore()}paint();
function draw(){const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,1.5);if(w!==viewW||h!==viewH){cv.width=Math.round(w*d);cv.height=Math.round(h*d);viewW=w;viewH=h}scale=Math.max(.98,Math.min(2.5,Math.min(w,h)/280));g.setTransform(d,0,0,d,0,0);g.fillStyle='#6eb4b2';g.fillRect(0,0,w,h);g.translate(w/2,h*.52);g.scale(scale,scale);g.translate(-camX,-camY*.72);g.drawImage(landscape,-410,-270);
 let things=resources.map(([x,y,k],i)=>[y,()=>prop(k,x,y*.72,s.rest[i]>Date.now())]);things.push([0,()=>shelter(0,0)],[beacon.y,()=>{const x=beacon.x,y=beacon.y*.72;poly([[x-12,y],[x-7,y-30],[x+4,y-39],[x+12,y]],'#6f817a');oval(x+1,y-36,6,9,s.lit?'#fff2a3':'#64858d');if(s.lit){g.globalAlpha=.25;oval(x,y-36,18,19,'#eafaa1');g.globalAlpha=1}}],[s.y,()=>ranger(s.x,s.y*.72)]);wild.forEach((v,i)=>{if(!s.friends.includes(i)){const p=creaturePos(i);things.push([p.y,()=>pet(i,p.x,p.y*.72)])}});if(s.active>=0)things.push([fy,()=>pet(s.active,fx,fy*.72,facing)]);things.sort((a,b)=>a[0]-b[0]);things.forEach(a=>a[1]());if(target&&mode==='play'){const y=target.y*.72-47;poly([[target.x-3,y-3],[target.x+3,y-3],[target.x,y+1]],'#fff5bc')}}
function frame(now){tick(Math.min(.06,(now-last)/1000||0));last=now;draw();requestAnimationFrame(frame)}
const pad=el('pad');function steer(e){if(e.pointerId!==padId)return;const r=pad.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.38),dy=(e.clientY-r.top-r.height/2)/(r.height*.38),n=Math.max(1,Math.hypot(dx,dy));stick=[dx/n,dy/n];pad.firstElementChild.style.transform='translate('+stick[0]*19+'px,'+stick[1]*19+'px)'}
pad.onpointerdown=e=>{padId=e.pointerId;pad.setPointerCapture(padId);steer(e)};pad.onpointermove=steer;pad.onlostpointercapture=()=>{padId=null;stick=[0,0];pad.firstElementChild.style.transform=''};el('act').onclick=interact;el('journal').onclick=journal;
window.addEventListener('keydown',e=>{if(mode!=='play')return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','e',' '].includes(k)){e.preventDefault();keys.add(k);if(!e.repeat&&(k==='e'||k===' '))interact()}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();stick=[0,0];if(saved)save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&saved)save()});
sheet('Mosswake Island','Befriend three wild creatures, build a woodland shelter and awaken the beacon guardian. Drag the pad to explore. Tap the action button near a creature or resource.',[[saved?'Continue adventure':'Land on the island',()=>{play();say(goal())}]]);requestAnimationFrame(frame);
</script></html>
