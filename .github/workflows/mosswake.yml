name: Mosswake Island game and Android release
on:
  push:
    branches: [main]
    paths: ['mosswake/**', '.github/workflows/mosswake.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report start
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=mosswake -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - run: node mosswake/check.mjs
      - name: Build and verify the Android package
        run: |
          cd mosswake
          bash ../android/build.sh
          mv dist/Vedyya-Drop.apk dist/Mosswake-Island.apk
      - name: Publish test APK
        run: |
          tag="mosswake-${GITHUB_SHA:0:12}"
          gh release create "$tag" mosswake/dist/Mosswake-Island.apk --target "$GITHUB_SHA" --title "Mosswake Island for Android" --notes "Standalone, offline creature adventure. Test-signed Android package." --prerelease
      - name: Report result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=mosswake -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
