name: Build Vedyya Drop APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/vedyya-drop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vedyya-Drop-Android
          path: dist/Vedyya-Drop.apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-test-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Vedyya-Drop.apk --clobber
          else
            gh release create "$tag" dist/Vedyya-Drop.apk --target "$GITHUB_SHA" --title "Vedyya Drop Android test build" --notes "Test-signed Android build for this revision." --prerelease
          fi
