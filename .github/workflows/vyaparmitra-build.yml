name: VyaparMitra Windows build
on:
  workflow_dispatch:
  push:
    branches: [vyaparmitra-pro]
    paths:
      - 'vyaparmitra/desktop/**'
      - '.github/workflows/vyaparmitra-build.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vyaparmitra/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VyaparMitra-Windows
          path: vyaparmitra/desktop/dist/*.exe
