<!doctype html><html><meta charset="utf-8"><title>VyaparMitra Pro</title><style>body{font:16px system-ui;background:#eef2f7;color:#172554;margin:32px}section{background:white;padding:20px;margin:16px 0;border-radius:12px}input,button,select{padding:10px;margin:4px}button{background:#145c66;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap}</style><h1>VyaparMitra Pro</h1><p>Desktop preview — not a certified GST invoicing system.</p><section><h2>Inventory</h2><form id="p"><input name="name" required placeholder="Product"><input name="qty" required type="number" min="0" placeholder="Stock"><input name="price" required type="number" min="0" step=".01" placeholder="Price ₹"><button>Add</button></form><pre id="stock"></pre></section><section><h2>Billing</h2><form id="b"><select name="item" id="items"></select><input name="qty" type="number" min="1" required value="1"><button>Add line</button></form><pre id="cart"></pre><button id="checkout">Complete sale</button><pre id="receipt"></pre></section><section><h2>Sales</h2><pre id="sales"></pre><button id="backup">Export backup</button></section><script>const $=x=>document.getElementById(x);let d=JSON.parse(localStorage.getItem('vm')||'{"products":[],"sales":[]}'),cart=[];function render(){localStorage.setItem('vm',JSON.stringify(d));$('stock').textContent=d.products.map(p=>p.name+' | '+p.qty+' units | ₹'+p.price).join('\n');$('items').replaceChildren(...d.products.map((p,i)=>new Option(p.name,i)));$('cart').textContent=cart.map(x=>d.products[x.i].name+' × '+x.q).join('\n');$('sales').textContent=d.sales.map(s=>s.date+' | ₹'+s.total.toFixed(2)).join('\n')} $('p').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));d.products.push({name:x.name,qty:Number(x.qty),price:Number(x.price)});e.target.reset();render()};$('b').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target)),i=Number(x.item),q=Number(x.qty),p=d.products[i];if(!p||!Number.isInteger(q)||q<1||q+cart.filter(z=>z.i===i).reduce((a,z)=>a+z.q,0)>p.qty)return alert('Insufficient stock');cart.push({i,q});render()};$('checkout').onclick=()=>{if(!cart.length)return;let total=0,lines=[];for(let x of cart){let p=d.products[x.i];p.qty-=x.q;total+=p.price*x.q;lines.push(p.name+' × '+x.q)}d.sales.push({date:new Date().toISOString(),total,lines});$('receipt').textContent=lines.join('\n')+'\nTotal ₹'+total.toFixed(2);cart=[];render()};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='backup.json';a.click()};render()</script></html>
