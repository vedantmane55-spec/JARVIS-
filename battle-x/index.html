<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Battle X Max</title><style>body{margin:0;background:#101820;color:white;font:18px system-ui;text-align:center}button,input{padding:14px;margin:6px;font:inherit}canvas{width:min(100vw,600px);height:auto;touch-action:none;background:#304d39}button{background:#e9a323;border:0;border-radius:8px}#game{display:none}</style><h1>BATTLE X MAX</h1><section id="login"><input id="nick" placeholder="Player name"><button onclick="enter()">Guest login</button></section><section id="lobby" hidden><h2 id="welcome"></h2><p>Training Battle Royale • Offline bots</p><button onclick="start()">Start match</button></section><section id="game"><p id="hud"></p><canvas id="c" width="600" height="450"></canvas><p>Touch arena to move • Fire at nearest enemy</p><button onclick="fire()">FIRE</button><button onclick="wall()">SHIELD</button><button onclick="reload()">RELOAD</button><button onclick="leave()">Lobby</button></section><script>const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let p,bots,target,hp,ammo,kills,shield,active=false,last=0;function enter(){let n=$('nick').value.trim()||'Guest';localStorage.setItem('battleName',n);$('welcome').textContent='Welcome '+n;$('login').hidden=true;$('lobby').hidden=false} $('nick').value=localStorage.getItem('battleName')||'';function start(){p={x:300,y:225};target={...p};hp=100;ammo=12;kills=0;shield=0;bots=Array.from({length:8},(_,i)=>({x:40+i*70,y:i%2?40:410,hp:2}));$('lobby').hidden=true;$('game').style.display='block';active=true;last=performance.now();requestAnimationFrame(loop)}function leave(){active=false;$('game').style.display='none';$('lobby').hidden=false}function fire(){if(!active||!ammo)return;ammo--;let b=bots.slice().sort((a,b)=>dist(a,p)-dist(b,p))[0];if(b&&dist(b,p)<220){b.hp--;if(!b.hp){bots=bots.filter(x=>x!==b);kills++}}}function reload(){ammo=12}function wall(){if(active)shield=3}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function move(a,b,s){let d=dist(a,b);if(d>1){a.x+=(b.x-a.x)*Math.min(1,s/d);a.y+=(b.y-a.y)*Math.min(1,s/d)}}c.onpointerdown=c.onpointermove=e=>{if(e.type==='pointermove'&&!e.buttons)return;let r=c.getBoundingClientRect();target={x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*450/r.height}};function loop(t){if(!active)return;let dt=Math.min(.05,(t-last)/1000);last=t;move(p,target,150*dt);shield=Math.max(0,shield-dt);ctx.clearRect(0,0,600,450);for(let b of bots){move(b,p,35*dt);if(dist(b,p)<35&&!shield)hp-=12*dt;ctx.fillStyle='#e64c4c';ctx.fillRect(b.x-9,b.y-9,18,18)}ctx.fillStyle='#50dfff';ctx.beginPath();ctx.arc(p.x,p.y,12,0,7);ctx.fill();if(shield){ctx.strokeStyle='white';ctx.beginPath();ctx.arc(p.x,p.y,24,0,7);ctx.stroke()}$('hud').textContent='HP '+Math.max(0,Math.ceil(hp))+' | Ammo '+ammo+' | Kills '+kills+' | Enemies '+bots.length;if(hp<=0||!bots.length){active=false;$('hud').textContent=hp<=0?'ELIMINATED — Kills '+kills:'VICTORY — Kills '+kills;return}requestAnimationFrame(loop)}</script></html>
