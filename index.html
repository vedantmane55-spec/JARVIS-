<style>

display:none!important}@media(max-height:470px){#veil{align-items:safe center;padding:12px 6vw}.tag{margin:4px 0}h1{font-size:48px;margin:6px 0}p,label,.actions{margin:7px 0}.data{padding:4px 0}}

<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('map'),g=canvas.getContext('2d'), world=1200, center=600;
let profile={name:'',wins:0,best:0},screen='guest',actors=[],shots=[],loot=[],age=0,frags=0,player=null,raf=0,last=0,stick={x:0,y:0},fire=false,keys=new Set(),pointer=null;
try{Object.assign(profile,JSON.parse(localStorage.getItem('vedyya-drop-v1')))}catch{}
function save(){try{localStorage.setItem('vedyya-drop-v1',JSON.stringify(profile))}catch{} if(accountUser){if(accountMode==='device'){try{const record=deviceRead(accountUser);if(record){record.profile={...profile};localStorage.setItem(deviceKey(accountUser),JSON.stringify(record))}}catch{}}else syncRecord()}}
function page(state,tag,title,desc,actions=[]){
 screen=state;$('gear').hidden=true;$('veil').hidden=false;$('hud').hidden=$('controls').hidden=true;
 $('tag').textContent=tag;$('title').innerHTML=title;$('desc').textContent=desc;
 $('login').hidden=state!=='guest';$('record').hidden=state!=='lobby';
 $('actions').replaceChildren(...actions.map(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(i)b.className='secondary';return b}));
}
function guest(){page('guest','SOLO SURVIVAL','VEDYYA<br><span>DROP</span>','Choose a callsign to play on Breakwater Island. Your record stays on this device.')}
function lobby(){player=null;dropTime=0;draw();$('record').textContent=profile.name+'  /  '+profile.wins+' wins  /  best '+profile.best+' KOs';page('lobby','3D SOLO  /  BREAKWATER ISLAND','READY TO<br><span>DROP?</span>','Drag the pad to move and swipe the island to look around. Tap Auto for manual aim. Walk over supplies to collect them. Open Bag to switch weapons or heal.',[['Start match →',start],[profile.sound===false?'Sound: off':'Sound: on',toggleSound],['Online squad',()=>{closeNet();roomPage('Two players share one island against ten bots.')}],['Character: '+(profile.model||'Scout'),()=>{profile.model=profile.model==='Ranger'?'Scout':'Ranger';save();lobby()}],['Outfit: '+['Scout','Pilot','Ranger'][profile.uniform||0],wardrobe],['Account',accountPage],['Edit callsign',()=>{$('name').value=profile.name;guest()}]])}
$('login').onsubmit=e=>{e.preventDefault();const n=$('name').value.trim();if(!n){$('name').value='';$('name').reportValidity();return}profile.name=n;save();lobby()};
const terrain=document.createElement('canvas');terrain.width=terrain.height=world;
function paintTerrain(){
 const c=terrain.getContext('2d');let seed=482;function rand(){seed=seed*16807%2147483647;return seed/2147483647}
 c.fillStyle='#19535c';c.fillRect(0,0,world,world);
 for(let i=0;i<2800;i++){const x=rand()*world,y=rand()*world;c.fillStyle=i%2?'#26646a':'#1f5b61';c.fillRect(x,y,4+rand()*22,2)}
 function coast(radius,color){c.beginPath();for(let i=0;i<=180;i++){let a=i*Math.PI/90,r=radius+13*Math.sin(a*7)+9*Math.cos(a*11);c.lineTo(center+Math.cos(a)*r,center+Math.sin(a)*r)}c.closePath();c.fillStyle=color;c.fill()}
 coast(552,'#468880');coast(540,'#b8b681');coast(527,'#718963');
 c.save();c.clip();for(let i=0;i<450;i++){c.fillStyle=i%2?'#829367':'#667f5d';c.beginPath();c.ellipse(rand()*world,rand()*world,12+rand()*64,8+rand()*27,rand()*4,0,7);c.fill()}
 c.strokeStyle='#aeaa83';c.lineWidth=20;c.beginPath();c.moveTo(110,690);c.bezierCurveTo(410,600,620,850,981,285);c.stroke();
 for(let i=0;i<140;i++){let x=rand()*world,y=rand()*world;c.fillStyle='#456453';c.beginPath();c.arc(x+3,y+4,9,0,7);c.fill();c.fillStyle='#59795a';c.beginPath();c.arc(x,y,9,0,7);c.fill()}
 for(const [x,y] of [[350,490],[750,530],[530,780],[485,285],[880,675]])for(let i=0;i<3;i++){c.save();c.translate(x+i*28,y+i%2*30);c.rotate(-.22);c.fillStyle='#53635c';c.fillRect(3,4,22,38);c.fillStyle='#b6b8a1';c.fillRect(0,0,22,38);c.fillStyle='#859389';c.fillRect(10,0,3,38);c.restore()}
 c.restore()
}
paintTerrain();
function actor(x,y){return {x,y,hp:100,cd:1,angle:0,phase:Math.random()*6}}
let soundEngine=null,zoneCalled=false,healthCalled=false;
function unlockSound(){
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio){soundEngine=soundEngine||new Audio();if(soundEngine.state==='suspended')soundEngine.resume().catch(()=>{})}}catch{}
}
function effect(pitch,end,duration){
 if(profile.sound===false||!soundEngine||soundEngine.state!=='running')return;
 const osc=soundEngine.createOscillator(),gain=soundEngine.createGain(),now=soundEngine.currentTime;
 osc.type='triangle';osc.frequency.setValueAtTime(pitch,now);osc.frequency.exponentialRampToValueAtTime(end,now+duration);gain.gain.setValueAtTime(.1,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(soundEngine.destination);osc.start();osc.stop(now+duration)
}
function callout(line){
 const label=$('radio');label.textContent=line;label.hidden=false;clearTimeout(callout.timer);callout.timer=setTimeout(()=>label.hidden=true,3000);
 if(profile.sound===false)return;
 if(window.DropVoice){window.DropVoice.say(line);return}if(window.speechSynthesis&&window.SpeechSynthesisUtterance){const u=new window.SpeechSynthesisUtterance(line);u.lang='en-US';u.rate=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
}
function toggleSound(){
 profile.sound=profile.sound===false;save();unlockSound();if(!profile.sound)window.speechSynthesis?.cancel();lobby();if(profile.sound)callout('Radio online.')
}
const guns=[
 {name:'Carbine',mag:24,damage:28,cool:.21,speed:450},
 {name:'SMG',mag:32,damage:18,cool:.11,speed:380},
 {name:'Marksman',mag:8,damage:59,cool:.58,speed:610}
];
const uniforms=[['#408d79','#6bc5a1','#286d65','#8adab2'],['#476aa7','#779ad7','#324777','#a6cfff'],['#a2663c','#d59951','#784b33','#ecc58b']];
let yaw=0,tilt=0,aiming=false,dropTime=0,bagOpen=false,cosYaw=1,sinYaw=0;
function loadout(){return {gun:0,ammo:[24,0,0],stock:[48,0,0],owned:[true,false,false],packs:1,reload:0,jump:0,crouch:false,sprint:false}}
function equip(a,key){
 if(!a||!a.kit||a.hp<=0)return;const k=a.kit,i=k.gun;
 if(key==='reload'&&!k.reload&&k.stock[i]>0&&k.ammo[i]<guns[i].mag)k.reload=1.25;
 if(key==='jump'&&!k.jump&&!k.crouch)k.jump=.72;
 if(key==='stance'){k.crouch=!k.crouch;k.sprint=false}
 if(key==='sprint'){k.sprint=!k.sprint;k.crouch=false}
 if(key==='swap'){for(let n=1;n<4;n++){let next=(i+n)%3;if(k.owned[next]){k.gun=next;k.reload=0;break}}}
 if(key==='heal'&&k.packs&&a.hp<100){a.hp=Math.min(100,a.hp+40);k.packs--}
}
function kitStep(a,dt){const k=a.kit;k.jump=Math.max(0,k.jump-dt);
 if(k.reload){k.reload=Math.max(0,k.reload-dt);if(!k.reload){let i=k.gun,n=Math.min(k.stock[i],guns[i].mag-k.ammo[i]);k.ammo[i]+=n;k.stock[i]-=n}}
}
function collect(a,p){const k=a.kit;if(p.item==='med'){k.packs++;return}const i=p.slot;k.stock[i]+=guns[i].mag;if(!k.owned[i]){k.owned[i]=true;k.ammo[i]=guns[i].mag;k.gun=i;k.reload=0}}
function spawnSupplies(){loot.forEach(p=>p.item='med');for(let i=0;i<36;i++){
 let a=i*2.39996,r=70+((i*109)%370);loot.push({x:center+Math.cos(a)*r,y:center+Math.sin(a)*r,item:'ammo',slot:i%3})}
 for(const a of actors.filter(a=>a.kit))loot.push({x:a.x+10,y:a.y-8,item:'ammo',slot:1});
}
function yawDepth(x,y){return (x-eyeX)*sinYaw-(y-eyeY)*cosYaw}
function sideDistance(x,y){return (x-eyeX)*cosYaw+(y-eyeY)*sinYaw}
function heights(a){const k=a.kit;return k?(k.jump?Math.sin(k.jump/.72*Math.PI)*16:0):0}
function hud(){if(!player?.kit)return;const k=player.kit,i=k.gun;
 $('gear').hidden=screen!=='match';$('kitStatus').textContent=(dropTime>0?'DROP '+Math.ceil(dropTime)+'s · ':'')+guns[i].name+' '+(k.reload?'Reloading':k.ammo[i]+'/'+k.stock[i])+(k.crouch?' · Crouched':k.sprint?' · Sprint':'');
 $('tools').hidden=!bagOpen;$('bagInfo').textContent=k.owned.map((v,j)=>v?guns[j].name+' '+k.ammo[j]+'/'+k.stock[j]:null).filter(Boolean).join(' · ')+' · Medkits '+k.packs;
 $('micBtn').hidden=!net.conn?.open
}
function action(cmd){if(screen!=='match')return;
 if(dropTime>5&&cmd==='jump'&&net.role!=='guest'){dropTime=5;return}if(cmd==='bag'){bagOpen=!bagOpen;hud();return}
 if(cmd==='aim'){aiming=!aiming;$('aimBtn').textContent=aiming?'Manual':'Auto';return}
 if(cmd==='mic'){toggleMic();return}
 if(net.role==='guest')sendNet({t:'act',cmd});else equip(player,cmd);hud()
}
let look=null;canvas.onpointerdown=e=>{if(screen!=='match')return;canvas.setPointerCapture(e.pointerId);look={id:e.pointerId,x:e.clientX,y:e.clientY}};
canvas.onpointermove=e=>{if(look?.id!==e.pointerId)return;yaw+=(e.clientX-look.x)*.009;tilt=Math.max(-.15,Math.min(.16,tilt+(e.clientY-look.y)/innerHeight*.46));look.x=e.clientX;look.y=e.clientY};canvas.onlostpointercapture=()=>look=null;
window.addEventListener('keydown',e=>{if(screen!=='match'||e.repeat)return;const cmd={r:'reload',j:'jump',c:'stance',shift:'sprint',b:'bag',h:'heal',q:'swap',m:'aim'}[e.key.toLowerCase()];if(cmd)action(cmd);if(e.key==='ArrowLeft'&&e.altKey)yaw-=.16;if(e.key==='ArrowRight'&&e.altKey)yaw+=.16});
function inputs(){return {x:stick.x+Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),y:stick.y+Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup')),yaw,manual:aiming,fire:fire||keys.has(' ')}}
let accountUser='',accountMode='cloud',accountQueue=Promise.resolve();
const deviceKey=user=>'drop-device-account:'+user;
function deviceRead(user){return JSON.parse(localStorage.getItem(deviceKey(user))||'null')}
const toHex=bytes=>Array.from(new Uint8Array(bytes),n=>n.toString(16).padStart(2,'0')).join('');
async function verifier(pass,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
 return toHex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(n=>parseInt(n,16))),iterations:160000,hash:'SHA-256'},key,256))}
async function deviceAuth(action,user,pass){
 user=user.toLowerCase();let record=deviceRead(user);
 if(action==='register'){if(record)throw Error('Username already exists on this device.');const salt=toHex(crypto.getRandomValues(new Uint8Array(16)));record={salt,hash:await verifier(pass,salt),profile:{...profile}};if(deviceRead(user))throw Error('Username already exists.');localStorage.setItem(deviceKey(user),JSON.stringify(record))}
 else if(!record||record.hash!==await verifier(pass,record.salt))throw Error('Incorrect device username or password.');
 localStorage.setItem('drop-device-session',user);return {user,profile:record.profile}
}
async function signOut(){if(accountMode==='device')localStorage.removeItem('drop-device-session');else await api('logout',{});accountUser='';profile={name:'',best:0,wins:0};save();guest()}
try{const user=localStorage.getItem('drop-device-session'),record=user&&deviceRead(user);if(record){accountMode='device';accountUser=user;Object.assign(profile,record.profile)}}catch{}

async function accountPage(){page('account','PLAYER ACCOUNT','PLAYER<br><span>PROFILE</span>','Checking the account server…',[['Lobby',lobby]]);
 try{if(location.protocol==='file:'||location.hostname==='appassets.androidplatform.net'||location.hostname.endsWith('githack.com'))throw Error('device');const status=await api('session',{});if(screen!=='account')return;if(!('user' in status))throw Error('device');accountUser=status.user||'';accountMode='cloud'}catch{if(screen!=='account')return;accountMode='device'} page('account','PLAYER ACCOUNT','PLAYER<br><span>PROFILE</span>',accountUser?'Signed in as '+accountUser+(accountMode==='device'?' on this device.':' on the game server.'):accountMode==='device'?'Create a device account to keep separate player records on this phone.':'Sign in to sync your callsign, outfit and record on the game server.',accountUser?[['Sign out',async()=>{try{await signOut()}catch(e){$('desc').textContent=e.message}}],['Lobby',lobby]]:[['Sign in',()=>accountSubmit('login')],['Register',()=>accountSubmit('register')],['Lobby',lobby]]);
 if(!accountUser){const form=document.createElement('div');form.innerHTML='<label>Username <input id="userId" maxlength="24" autocomplete="username"></label><label>Password <input id="pass" type="password" minlength="10" autocomplete="current-password"></label>'; $('actions').prepend(form)}}
async function api(action,data){
 let r;try{r=await fetch('/api/'+action,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}catch{}
 if(!r||!r.headers.get('content-type')?.includes('application/json'))throw Error('Cloud accounts need the game server. Guest play works on this version.');
 const body=await r.json();if(!r.ok)throw Error(body.error||'Request failed');return body
}
async function accountSubmit(action){const user=$('userId').value.trim(),pass=$('pass').value;if(!/^[a-zA-Z0-9_]{3,24}$/.test(user)||pass.length<10){$('desc').textContent='Use a 3–24 character username and a password of at least 10 characters.';return}
 try{const result=accountMode==='device'?await deviceAuth(action,user,pass):await api(action,{user,pass,profile});accountUser=result.user;Object.assign(profile,result.profile);save();lobby()}catch(e){$('desc').textContent=e.message}}
function syncRecord(){const data={name:profile.name,best:profile.best,wins:profile.wins,uniform:profile.uniform||0,model:profile.model||'Scout'};accountQueue=accountQueue.catch(()=>{}).then(()=>accountUser?api('record',data):null).catch(()=>{})}

function wardrobe(){profile.uniform=((profile.uniform||0)+1)%3;save();lobby()}
const net={peer:null,conn:null,role:'',stream:null,audio:null,input:{},clock:0,generation:0,quick:false};
function sendNet(data){if(net.conn?.open)net.conn.send(data)}
function closeNet(){$('micBtn').textContent='Mic off';net.generation++;net.stream?.getTracks().forEach(t=>t.stop());net.stream=null;net.audio?.remove();net.audio=null;const p=net.peer;net.peer=null;net.conn=null;net.role='';net.input={};p?.destroy()}
function leaveRoom(){cancelAnimationFrame(raf);clearInput();closeNet();lobby()}
function roomPage(msg){page('room','ONLINE DUOS','SQUAD<br><span>RADIO</span>',msg,[['Invite a friend',()=>openRoom('host')],['Join with code',()=>{const code=prompt('Six-character squad code');if(code)openRoom('join',code.trim().toUpperCase())}],['Find teammate',()=>openRoom('quick')],['Lobby',leaveRoom]])}
function waitRoom(msg){page('waiting','ONLINE DUOS','SQUAD<br><span>RADIO</span>',msg,[['Cancel',leaveRoom]])}
function loadPeer(){if(window.Peer)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';s.onload=ok;s.onerror=()=>no(Error('Could not load the online service.'));document.head.append(s)})}
async function openRoom(mode,code='',slot=0){
 unlockSound();closeNet();const generation=net.generation,quick=mode==='quick'||mode==='queueJoin',host=mode==='host'||mode==='quick';
 if(mode==='join'&&!/^[A-Z0-9]{6}$/.test(code)){roomPage('Enter the six-character code from your teammate.');return}
 if(mode==='host'){const bytes=crypto.getRandomValues(new Uint8Array(6));code=Array.from(bytes,b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('')}
 const room=quick?'vd-breakwater-4-queue-'+slot:'vd-breakwater-4-'+code;
 waitRoom('Connecting to squad radio…');
 try{await loadPeer();if(generation!==net.generation)return;const peer=host?new Peer(room):new Peer();net.peer=peer;net.role=host?'host':'guest';
 const fail=message=>{if(generation!==net.generation)return;closeNet();roomPage(message)};
 const timeout=setTimeout(()=>{if(generation===net.generation&&!net.conn?.open)fail('Connection timed out. Try another network or start a new room.')},host?150000:22000);
 peer.on('open',()=>{if(host)waitRoom(quick?'Searching for a teammate…':'Share this squad code: '+code);else attach(peer.connect(room,{reliable:true}),false)});
 peer.on('connection',c=>{if(!host||net.conn){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),250)});return}attach(c,true)});
 peer.on('call',call=>{if(!net.conn?.open||call.peer!==net.conn.peer){call.close();return}call.answer();call.on('stream',stream=>{net.audio?.remove();const a=document.createElement('audio');net.audio=a;a.autoplay=true;a.srcObject=stream;document.body.append(a);a.play().catch(()=>callout('Tap Mic to enable squad audio.'))})});
 peer.on('error',err=>{if(generation!==net.generation)return;if(mode==='quick'&&err.type==='unavailable-id'){openRoom('queueJoin','',slot);return}fail('Squad connection failed. Check the room code and internet connection.')});
 function attach(c,isHost){net.conn=c;c.on('open',()=>{clearTimeout(timeout);if(isHost){start();sendNet({t:'hello'});snapshot()}else {unlockSound();waitRoom('Connected. Waiting for drop…')}});
 c.on('data',m=>{if(generation!==net.generation||!m||typeof m!=='object')return;
 if(m.t==='full'&&quick&&slot<8){openRoom('quick','',slot+1);return}
 if(m.t==='full'){fail('This squad already has two players.');return}
 if(isHost){if(screen!=='match')return;if(m.t==='input'){const clamp=n=>Math.max(-1,Math.min(1,Number(n)||0));net.input={x:clamp(m.x),y:clamp(m.y),manual:m.manual===true,fire:m.fire===true,yaw:Number.isFinite(m.yaw)?m.yaw:0};actors[1].uniform=Math.max(0,Math.min(2,Number(m.uniform)|0))}if(m.t==='act'&&['reload','swap','jump','heal','stance','sprint'].includes(m.cmd))equip(actors[1],m.cmd)}
 else if(m.t==='state'){actors=m.actors;player=actors[1];shots=m.shots;loot=m.loot;age=m.age;dropTime=m.drop;frags=m.kos;if(screen!=='match'){bagOpen=false;resume();callout('Squad deployed.')}hud();$('stats').textContent='HP '+Math.ceil(player.hp)+' · '+actors.filter(a=>a.hp>0).length+' alive · '+frags+' squad KOs'}
